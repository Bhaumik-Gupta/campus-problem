<body>
    <head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
    <h1>Admin Dashboard</h1>

    <div class="stats">

        <div class="stat-card">
            <h3>Total Problems</h3>
            <p id="totalCount">0</p>
        </div>

        <div class="stat-card">
            <h3>Pending</h3>
            <p id="pendingCount">0</p>
        </div>

        <div class="stat-card">
            <h3>In Progress</h3>
            <p id="progressCount">0</p>
        </div>

        <div class="stat-card">
            <h3>Resolved</h3>
            <p id="resolvedCount">0</p>
        </div>

    </div>


    <h2>Reported Problems</h2>

    <div id="adminComplaints"></div>


    <script src="admin.js"></script>

</body>
